# Engine configure switches for the Collabora Online build
# builds the engine in-tree with ./autogen.sh
# --with-distro=CPLinux-LOKit). The language list comes from
# Langs.conf via the INCLUDE below, so it is never duplicated here.

# pull in shared config
INCLUDE:CPLinuxCommon
INCLUDE:Langs

# enable features for Online release build
--enable-noto-font
--enable-sal-log
--enable-epm
--with-package-format=deb rpm
--with-myspell-dicts
--with-external-dict-dir=/usr/share/hunspell
--with-external-hyph-dir=/usr/share/hyphen
--with-external-thes-dir=/usr/share/mythes

# disable features
--without-gssapi

# use internal libraries
--enable-python=internal
--without-system-curl
--without-system-expat
--without-system-fontconfig
--without-system-freetype
--without-system-graphite
--without-system-harfbuzz
--without-system-icu
--without-system-jars
--without-system-libpng
--without-system-libxml
