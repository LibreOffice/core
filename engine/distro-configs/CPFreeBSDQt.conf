# Engine configure switches for the Collabora Office Qt desktop app on
# FreeBSD (./autogen.sh --with-distro=CPFreeBSDQt). Modelled on
# CPLinuxQtFlatpak, but takes every library the FreeBSD ports tree carries
# from the system, the way editors/libreoffice does, so that a port or a
# poudriere-built pkg has a short distfile list and a short build. The
# language list comes from Langs.conf via the INCLUDE below.
#
# Paths assume the default LOCALBASE of /usr/local. A ports Makefile can
# override any of them by appending its own switches after --with-distro.

# pull in shared config
INCLUDE:CPLinuxCommon
INCLUDE:Langs

# FreeBSD host tools
--with-gnu-patch=/usr/local/bin/gpatch

# enable features
--enable-python=system

# disable features
--disable-noto-font
--disable-sal-log
--disable-epm
--without-myspell-dicts
--with-external-dict-dir=/usr/local/share/hunspell
--with-external-hyph-dir=/usr/local/share/hyphen
--with-external-thes-dir=/usr/local/share/mythes

# use stuff from the system: the same set as the flatpak build
--with-system-altlinuxhyph
--with-system-cppunit
--with-system-curl
--with-system-expat
--with-system-fontconfig
--with-system-freetype
--with-system-graphite
--with-system-harfbuzz
--with-system-hunspell
--with-system-icu
--with-system-lcms2
--with-system-libpng
--with-system-libtiff
--with-system-libwebp
--with-system-libxml
--with-system-mythes
--with-system-nss
--with-system-openssl
--with-system-zstd

# use stuff from the system: additionally available in FreeBSD ports
--with-system-abseil
--with-system-boost
--with-system-bzip2
--with-system-clucene
--with-system-coinmp
--with-system-fast-float
--with-system-frozen
--with-system-glm
--with-system-libabw
--with-system-libcdr
--with-system-libcmis
--with-system-libebook
--with-system-libepubgen
--with-system-libetonyek
--with-system-libexttextcat
--with-system-libfreehand
--with-system-liblangtag
--with-system-libmspub
--with-system-libmwaw
--with-system-libnumbertext
--with-system-libodfgen
--with-system-libpagemaker
--with-system-libqxp
--with-system-librevenge
--with-system-libstaroffice
--with-system-libvisio
--with-system-libwpd
--with-system-libwpg
--with-system-libwps
--with-system-libzmf
--with-system-lzma
--with-system-md4c
--with-system-mdds
--with-system-odbc
--with-system-openjpeg
--with-system-orcus
--with-system-redland
--with-system-sane
--with-system-sqlite3
--with-system-xmlsec
--with-system-zxing

# use internal libraries: not packaged in FreeBSD ports
--without-system-argon2
--without-system-dragonbox
--without-system-libeot
--without-system-libfixmath
--without-system-zxcvbn
