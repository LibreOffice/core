# Developer variant of CPLinux-LOKit for fast local iteration: the LOKit
# build with the production-only pieces turned off (packaging, translated
# language resources, and merged libraries) and debugging utilities turned
# on, plus a shared ccache so object files can be reused across work trees.
# Use it with:
#
#     ./autogen.sh --with-distro=CPLinux-LOKit-Dev
#
INCLUDE:CPLinux-LOKit
--without-package-format
--without-lang
--disable-mergelibs
--enable-dbgutil
--enable-ccache-shared
