# Collabora Office with a LanguageTool server beside it. Collabora reaches
# the checker over HTTPS, at https://languagetool/v2, on a network of its
# own: the checker answers anyone who can reach it, with no password.
#
#   docker compose up
#
# Then open a Writer document and the checker underlines what it finds as
# you type, in every language of its language list that the server has.
# allowed_languages in coolwsd.xml does not limit it (see the README).
#
# The LanguageTool server speaks plain HTTP only, so an nginx front serves
# it over HTTPS, with a certificate that ../tls/make-certs.sh makes on the
# first start, in ./certs. Collabora Office is given the certificate
# authority that signed it, and verifies the front as it would any other
# server (see ../tls/README).

services:
  collabora:
    image: collabora/code:latest
    ports:
      - "9980:9980"
    environment:
      # Your hosts, as for any Collabora Office container.
      - aliasgroup1=https://my-wopi-host.example.com:443
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:languagetool.enabled=true --o:languagetool.base_url=https://languagetool/v2
    volumes:
      # The usual certificate authorities and the one of ./certs, for
      # Collabora Office and for the document processes in their jails.
      - ./certs/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ./certs/ca-bundle.crt:/opt/cool/systemplate/etc/ssl/certs/ca-certificates.crt:ro
    networks:
      - web
      - checkers
    depends_on:
      languagetool:
        condition: service_healthy
    restart: unless-stopped

  # The HTTPS front, the only part of the service Collabora Office can reach.
  languagetool:
    image: nginx:stable-alpine
    environment:
      - TLS_HOST=languagetool
      - TLS_UPSTREAM=languagetool-server:8010
      # What Collabora Office asks for; the front refuses any other path.
      - TLS_PATHS=/v2/check|/v2/languages
    volumes:
      - ../tls/front.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--cacert", "/certs/ca.crt",
             "--resolve", "languagetool:443:127.0.0.1",
             "https://languagetool/v2/languages"]
      interval: 30s
      timeout: 5s
      start_period: 10s
    networks:
      - checkers
      - languagetool
    depends_on:
      languagetool-server:
        condition: service_healthy
    restart: unless-stopped

  languagetool-server:
    # Built from https://github.com/CollaboraOnline/docker-languagetool.
    image: collabora/languagetool:latest
    # The server wants half a gigabyte or so; give the Java runtime what the
    # host can spare, and more with n-grams.
    environment:
      - JAVAOPTIONS=-Xmx768m
    # The n-gram data, when you have it (see the README):
    # volumes:
    #   - /srv/ngrams:/ngrams:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8010/v2/languages"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    networks:
      - languagetool
    depends_on:
      certs:
        condition: service_completed_successfully
    restart: unless-stopped

  # Makes the certificates in ./certs on the first start, then exits.
  certs:
    image: collabora/languagetool:latest
    user: root
    entrypoint: ["sh", "/make-certs.sh", "languagetool"]
    volumes:
      - ../tls/make-certs.sh:/make-certs.sh:ro
      - .:/service
    network_mode: none

networks:
  web:
  checkers:
    internal: true
  languagetool:
    internal: true
