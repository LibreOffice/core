    # static files
    location ^~ /browser {
        proxy_pass http://localhost:9980;
        proxy_set_header Host $host;
    }

    # WOPI discovery URL
    location ^~ /hosting/discovery {
        proxy_pass http://localhost:9980;
        proxy_set_header Host $host;
    }

    # Capabilities
    location ^~ /hosting/capabilities {
        proxy_pass http://localhost:9980;
        proxy_set_header Host $host;
    }

    # main websocket, download, presentation (legacy svg) and image upload
    location ^~ /cool/ {
        proxy_pass http://localhost:9980;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 36000s;
    }

    # backward compatibility for integrations that use the /lool/ POST API
    location ^~ /lool/ {
        proxy_pass http://localhost:9980;
        proxy_set_header Host $host;
    }

    # health checks (since 26.04.3.1), for load balancers and monitoring
    # /livez tells whether the process needs a restart, /readyz whether it can
    # take new documents. They need no authentication, so restrict them to your
    # monitoring hosts if they should not be reachable from the internet. See
    # https://sdk.collaboraonline.com/docs/installation/Health_checks.html
    location ^~ /livez {
        proxy_pass http://localhost:9980;
        proxy_set_header Host $host;
    }

    location ^~ /readyz {
        proxy_pass http://localhost:9980;
        proxy_set_header Host $host;
    }

